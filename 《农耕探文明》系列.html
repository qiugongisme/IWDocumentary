/* =================== 渲染引擎 =================== */
const app = document.getElementById('app');
const toast = document.getElementById('toast');

function showToast(msg){
  toast.textContent = msg; toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),1800);
}

function copyUrl(url){
  navigator.clipboard?.writeText(url).then(()=>showToast('已复制播放地址到剪贴板'))
    .catch(()=>{
      const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);
      ta.select();document.execCommand('copy');document.body.removeChild(ta);
      showToast('已复制播放地址到剪贴板');
    });
}

// 封面图候选
function thumbCandidates(guid){
  return [
    `https://h5.cntv.com.cn/podcast/image/${guid}.jpg`,
    `https://pqiowcfwn0.smartapps.cn/${guid}.jpg`
  ];
}

function buildCard(ep, seasonNo){
  const [epNo, title, date, url, guid] = ep;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="thumb" onclick="window.open('${url}','_blank')">
      <span class="ep-tag">S${seasonNo} ${epNo}</span>
      <span class="date-tag">${date}</span>
      <div class="thumb-fallback"><div class="ep">${epNo.replace('第','').replace('集','')}</div><div class="label">农耕探文明</div></div>
    </div>
    <div class="body">
      <h3>${title.replace(/^(.+?)(\s+)(.+)$/,'$1 <span class="loc">$3</span>')}</h3>
      <a class="open-btn" href="${url}" target="_blank">▶ 立即观看</a>
      <button class="copy-btn" data-url="${url}">复制播放地址</button>
    </div>`;
  // 异步加载封面图
  const thumb = card.querySelector('.thumb');
  const candidates = thumbCandidates(guid);
  let idx = 0;
  const tryLoad = ()=>{
    if(idx >= candidates.length) return;
    const img = new Image();
    img.onload = ()=>{
      img.style.width='100%';img.style.height='100%';img.style.objectFit='cover';
      thumb.innerHTML = `<span class="ep-tag">S${seasonNo} ${epNo}</span><span class="date-tag">${date}</span>`;
      thumb.appendChild(img);
    };
    img.onerror = ()=>{ idx++; tryLoad(); };
    img.src = candidates[idx];
  };
  tryLoad();
  card.querySelector('.copy-btn').addEventListener('click', e=>{
    e.stopPropagation(); copyUrl(e.currentTarget.dataset.url);
  });
  return card;
}

// ----- 控制栏 -----
const controls = document.createElement('div');
controls.id = 'controls';
controls.innerHTML = `
  <div class="tabs">
    <button class="tab active" data-season="all">全部</button>
    <button class="tab" data-season="1">第一季</button>
    <button class="tab" data-season="2">第二季</button>
    <button class="tab" data-season="3">第三季</button>
  </div>
  <div class="search">
    <input type="text" id="searchInput" placeholder="搜索视频名称…" autofocus>
  </div>
`;
app.appendChild(controls);

const content = document.createElement('div');
content.id = 'content';
app.appendChild(content);

let currentTab = 'all';
let keyword = '';

function render() {
  let filteredSeasons = DATA.filter(s => {
    if (currentTab === 'all') return true;
    return s.season === parseInt(currentTab);
  });

  content.innerHTML = '';
  filteredSeasons.forEach(s => {
    let eps = s.eps;
    if (keyword.trim() !== '') {
      const kw = keyword.trim().toLowerCase();
      eps = eps.filter(ep => ep[1].toLowerCase().includes(kw));
    }
    if (eps.length === 0) return;

    const wrap = document.createElement('section');
    wrap.className = 'season';
    const head = document.createElement('div');
    head.className = 'season-head';
    head.innerHTML = `
      <div class="season-badge">S${s.season}</div>
      <div>
        <h2>${s.title}</h2>
        <div class="meta">共 ${s.total} 集 · 播出时间 ${s.range}</div>
      </div>
    `;
    wrap.appendChild(head);
    const grid = document.createElement('div');
    grid.className = 'grid';
    eps.forEach(ep => {
      grid.appendChild(buildCard(ep, s.season));
    });
    wrap.appendChild(grid);
    content.appendChild(wrap);
  });

  // 若没有匹配结果，显示提示
  if (content.children.length === 0) {
    const empty = document.createElement('p');
    empty.style.cssText = 'text-align:center;color:var(--muted);padding:60px 0;font-size:1.1rem';
    empty.textContent = '😕 未找到匹配的剧集，请尝试其他关键词';
    content.appendChild(empty);
  }
}

// 绑定事件
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentTab = this.dataset.season;
    render();
  });
});

document.getElementById('searchInput').addEventListener('input', function() {
  keyword = this.value;
  render();
});

// 初始渲染
render();
</script>
