        const PROVINCE_EXCEPTIONS = {'广汉': '四川'};

        function extractProvince(title) {
            let body = title.replace(/^《中国影像方志》\s*/, '').replace(/^\d{8}\s*/, '').replace(/第\d+集\s*/, '');
            for (const p of PROVINCES) {
                if (body.startsWith(p)) return p;
            }
            for (const key in PROVINCE_EXCEPTIONS) {

            }
            return '';
        }

                <label class="province-option">
                    <input type="checkbox" value="${p}" ${selectedProvinces.has(p) ? 'checked' : ''} onchange="toggleProvince(this.value)">
                    <span class="province-name">${p || '未分类'}</span>
                    <span class="province-count">${provinceData[p]}</span>
                </label>
            `).join('');
            document.getElementById('provinceCount').textContent = selectedProvinces.size ? `(已选 ${selectedProvinces.size})` : '(全部)';
        }

        function toggleProvince(p) {
            if (selectedProvinces.has(p)) {
                selectedProvinces.delete(p);
            } else {
                selectedProvinces.add(p);
            }
            renderProvinceOptions();
            applyFilters();
        }

        function selectAllProvinces() {
            selectedProvinces = new Set(provinceList);
            renderProvinceOptions();
            applyFilters();
        }

        function clearProvinces() {
            selectedProvinces = new Set();
            renderProvinceOptions();
            applyFilters();
        }

        function toggleProvinceDropdown() {
            document.getElementById('provinceDropdown').classList.toggle('open');
        }

        function closeProvinceDropdown() {
            document.getElementById('provinceDropdown').classList.remove('open');
        }

        function applyFilters() {
            filteredData = allData.filter(item => {
                const kwOk = !searchKeyword || item.title.includes(searchKeyword) || String(item.episode).includes(searchKeyword);
                const p = extractProvince(item.title);
                const provOk = selectedProvinces.size === 0 || selectedProvinces.has(p);
                return kwOk && provOk;
            });
            currentPage = 1;
            render();
        }

        function render() {
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageData = filteredData.slice(start, end);
            const totalPages = Math.ceil(filteredData.length / pageSize) || 1;

            const provText = selectedProvinces.size > 0 ? ` · 省份：${[...selectedProvinces].join('、')}` : '';
            document.getElementById('stats').textContent =
                `共 ${filteredData.length} 条记录 · 第 ${currentPage}/${totalPages} 页 ${searchKeyword ? `· 搜索："${searchKeyword}"` : ''}${provText}`;

            const grid = document.getElementById('videoGrid');
            if (pageData.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                        <p>未找到匹配的视频</p>
                    </div>`;
            } else {
                grid.innerHTML = pageData.map(item => `
                    <div class="video-card">
                        <div class="episode-badge">第 ${item.episode || '?'} 集</div>
                        <div class="video-title">${item.title}</div>
                        <div class="video-actions">
                            <a class="btn-watch" href="${item.url}" target="_blank">▶ 去观看</a>
                            <button class="btn-copy" type="button" data-url="${item.url}">复制播放地址</button>
                        </div>
                    </div>
                `).join('');
            }

            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const pagination = document.getElementById('pagination');
            let html = '';
            
            html += `<button onclick="goPage(1)" ${currentPage === 1 ? 'disabled' : ''}>首页</button>`;
            html += `<button onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>`;
            
            const maxButtons = 7;
            let startPage = Math.max(1, currentPage - Math.floor(maxButtons / 2));
            let endPage = Math.min(totalPages, startPage + maxButtons - 1);
            if (endPage - startPage < maxButtons - 1) {
                startPage = Math.max(1, endPage - maxButtons + 1);
            }
            
            if (startPage > 1) html += `<button disabled>...</button>`;
            
            for (let i = startPage; i <= endPage; i++) {
                html += `<button onclick="goPage(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
            }
            
            if (endPage < totalPages) html += `<button disabled>...</button>`;
            
            html += `<button onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>`;
            html += `<button onclick="goPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>尾页</button>`;
            
            pagination.innerHTML = html;
        }

        function goPage(page) {
            const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleSearch() {
            const keyword = document.getElementById('searchInput').value.trim();
            searchKeyword = keyword;
            applyFilters();
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            searchKeyword = '';
            selectedProvinces = new Set();
            renderProvinceOptions();
            applyFilters();
        }

        function copyUrl(url, btn) {
            const done = () => {
                btn.textContent = '已复制 ✓';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '复制播放地址';
                    btn.classList.remove('copied');
                }, 1500);
            };
            const fallback = () => {
                const ta = document.createElement('textarea');
                ta.value = url;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); } catch (err) {}
                document.body.removeChild(ta);
                done();
            };
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(url).then(done).catch(fallback);
            } else {
                fallback();
            }
        }

        document.getElementById('videoGrid').addEventListener('click', function(e) {
            const btn = e.target.closest('.btn-copy');
            if (btn) copyUrl(btn.getAttribute('data-url'), btn);
        });

        document.addEventListener('click', function(e) {
            const wrap = document.querySelector('.province-filter');
            if (wrap && !wrap.contains(e.target)) closeProvinceDropdown();
        });

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleSearch();
        });

        let debounceTimer;
        document.getElementById('searchInput').addEventListener('input', function(e) {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                if (e.target.value === '') resetSearch();
                else handleSearch();
            }, 300);
        });

        renderProvinceOptions();
        render();
    </script>
</body>
</html>
